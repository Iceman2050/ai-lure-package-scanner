[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lure-package-scanner"
version = "0.1.0"
description = "Scan package.json/lockfile for AI-lure malware patterns (fake AI SDK wave)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.scripts]
ai-lure-scan = "lure_scanner.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
